<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuck Kids — Painel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/jpeg" href="/assets/img/tuck-logo.jpg">
<link rel="stylesheet" href="/css/fonts.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FBF7EF;
  font-family: 'Nunito Sans', -apple-system, sans-serif; color: #101B4D; }
.card { background: #fff; border: 1.5px solid rgba(16,27,77,.08); border-radius: 24px;
  padding: 40px 36px; width: min(400px, 92vw); box-shadow: 0 20px 50px rgba(16,27,77,.1); text-align: center; }
.card img { height: 64px; mix-blend-mode: multiply; }
h1 { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 20px; margin: 14px 0 4px; }
p { margin: 0 0 24px; font-size: 14px; font-weight: 600; color: rgba(16,27,77,.55); }
input { width: 100%; border: 1.5px solid rgba(16,27,77,.2); border-radius: 12px; padding: 13px 16px;
  font: 600 15px 'Nunito Sans', sans-serif; color: #101B4D; margin-bottom: 14px; }
input:focus { outline: 2px solid #4F9993; border-color: transparent; }
button { width: 100%; border: 0; border-radius: 999px; padding: 14px; background: #FF6655; color: #fff;
  font: 600 16px 'Poppins', sans-serif; cursor: pointer; box-shadow: 0 6px 18px rgba(255,102,85,.32); }
button:hover { background: #e9503f; }
button:disabled { opacity: .5; }
.err { color: #d0342a; font-size: 13.5px; font-weight: 700; min-height: 20px; margin: 12px 0 0; }
.back { display: inline-block; margin-top: 18px; font-size: 13px; font-weight: 700; color: #4F9993; text-decoration: none; }
</style>
</head>
<body>
<form class="card" id="f">
<img src="/assets/img/tuck-logo.jpg" alt="Tuck Kids">
<h1>Painel de edição</h1>
<p>Entre para editar o site diretamente na página.<br>Suas ações ficam registradas no histórico.</p>
<input type="text" id="login" placeholder="Usuário" autocomplete="username" autofocus required>
<input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
<button type="submit" id="btn">Entrar</button>
<div class="err" id="err"></div>
<a class="back" href="/">← voltar para o site</a>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: document.getElementById('login').value, password: document.getElementById('senha').value }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'erro');
    location.href = '/painel';
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
